name: Update Steam stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Steam statistics
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_VANITY_URL: Velzinha
        run: python scripts/steam_stats.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/steam-stats.svg assets/steam-stats.json
          if git diff --cached --quiet; then
            echo "Steam statistics have not changed."
          else
            git commit -m "chore: update Steam profile statistics"
            git push
          fi
